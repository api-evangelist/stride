aid: stride
name: Stride
description: >-
  Stride is a multichain liquid staking protocol built as a Cosmos SDK appchain
  (chain-id stride-1) and secured by Cosmos Hub interchain security. Users stake
  proof-of-stake assets such as ATOM, TIA, DYDX, OSMO, DYM, SAGA, and LUNA and
  receive liquid staking receipt tokens (stATOM, stTIA, and others) that keep
  accruing staking rewards while remaining usable across DeFi for trading,
  lending, collateral, and liquidity provision. Stride is IBC-connected and uses a
  Hyperlane bridge for cross-chain reach. Its machine-readable surface is the
  Cosmos SDK gRPC and REST (LCD) query interface plus IBC, wrapped by the official
  stridejs TypeScript SDK; Stride does not publish a REST OpenAPI. Backed by
  Multicoin Capital.
